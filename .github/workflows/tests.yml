name: tests

on:
  push:
  pull_request:

jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      # Plain-Python test runner: each test prints [OK]/[FAIL] lines and the
      # runner exits non-zero if any check fails.
      - run: python tests/executa_tests.py
